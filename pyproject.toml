[tool.poetry]
name = "crawlforge"
version = "0.1.0"
description = "Professional web scraping system powered by crawl4ai"
authors = ["CrawlForge Team"]
readme = "README.md"
packages = [{include = "crawlforge"}]

[tool.poetry.dependencies]
python = "^3.11"
crawl4ai = "^0.8.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
loguru = "^0.7.3"
supabase = "^2.13.0"
openai = "^1.60.0"
google-generativeai = "^0.8.0"
redis = {extras = ["hiredis"], version = "^5.2.0"}
aiofiles = "^24.1.0"
httpx = "^0.28.0"
bleach = "^6.1.0"
weasyprint = "^62.3"
html2text = "^2024.2.26"
PyYAML = "^6.0.1"
questionary = "^2.1.0"
rich = "^13.9.0"
typer = {extras = ["all"], version = "^0.15.0"}
pydyf = "<0.11.0"
fonttools = "^4.62.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"
mypy = "^1.14.0"
httpx = "^0.28.0"

[tool.poetry.scripts]
crawlforge = "crawlforge.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crawlforge"]

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── MyPy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
