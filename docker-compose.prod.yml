# ═══════════════════════════════════════════════════════
# CrawlForge — Docker Compose (Production)
# No source volumes, healthchecks, configurable replicas
# Nginx load-balances across app replicas
# ═══════════════════════════════════════════════════════

services:
  # ── Nginx (load balancer / public entry point) ───────
  nginx:
    image: nginx:alpine
    container_name: crawlforge-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── FastAPI App ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crawlforge:latest
    # No ports here — nginx handles external traffic.
    # Replicas share the internal network without port conflicts.
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/crawlforge
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── Redis (persistent) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crawlforge-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── PostgreSQL + pgvector ────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: crawlforge-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: crawlforge
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data-prod:
  postgres-data-prod:
